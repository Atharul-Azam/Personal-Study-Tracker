name: Build and verify Windows app

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Unit tests
        run: npm test

      - name: UI tests (headless Chromium)
        run: |
          npx playwright install chromium
          npm run test:ui

      - name: Smoke test, unpackaged (real Electron, real SQLite)
        shell: pwsh
        run: |
          ./scripts/smoke.ps1 -Exe (Join-Path $PWD 'node_modules\electron\dist\electron.exe') -Out (Join-Path $PWD 'smoke-dev.json') -AppArgs '.'

      - name: Build .exe (installer + portable)
        run: npm run dist:win

      - name: Smoke test the PACKAGED app
        shell: pwsh
        run: |
          ./scripts/smoke.ps1 -Exe (Join-Path $PWD 'dist\win-unpacked\Study Tracker.exe') -Out (Join-Path $PWD 'smoke-packaged.json')

      - name: Install with the NSIS installer (silent) and smoke test the installed app
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Filter '*-setup.exe' | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $installed = Join-Path $env:LOCALAPPDATA 'Programs\Study Tracker\Study Tracker.exe'
          if (-not (Test-Path $installed)) { throw "installer did not install to $installed" }
          $menu = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Study Tracker.lnk'
          if (-not (Test-Path $menu)) { throw "Start Menu shortcut missing: $menu" }
          ./scripts/smoke.ps1 -Exe $installed -Out (Join-Path $PWD 'smoke-installed.json')

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: StudyTracker-windows
          path: |
            dist/*-setup.exe
            dist/*-portable.exe
            smoke-*.json
          if-no-files-found: warn
